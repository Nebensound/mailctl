# cargo-deny: only permissive licenses, no known vulnerabilities.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # chrono comes only through imap 3.0.0-alpha.15 (no release without it);
    # mailctl does not use it. Unmaintained, no known vulnerability. Remove
    # once imap drops chrono.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; only a transitive dependency of imap" },
]

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
