# cargo-deny: only permissive licenses, no known vulnerabilities.
[graph]
all-features = true

[advisories]
version = 2
# Temporary exceptions, tracked in #12. Both are "unmaintained" notices, not
# vulnerabilities, and both crates come in only through async-imap; mailctl
# uses neither itself. Remove an entry as soon as a released async-imap no
# longer depends on that crate (check with `cargo tree -i <crate>`), so that
# `cargo deny check` passes without it again.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono: async-imap parses INTERNALDATE with it; remove when async-imap drops chrono (#12)" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils: removed in async-imap main (async-email/async-imap#155), remove with its next release (#12)" },
]

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
