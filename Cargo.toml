[workspace]
resolver = "3"
members = ["crates/mailctl"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nebensound/mailctl"
publish = true

[workspace.dependencies]
clap = { version = "4.6.8", features = ["derive", "env"] }
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
futures-util = { version = "0.3.34", default-features = false }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "native-tls", "hostname"] }
hickory-resolver = "0.26.3"
mail-parser = "0.11.9"
native-tls = "0.2.18"
roxmltree = "0.21.2"
rpassword = "7.5.5"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
tokio-native-tls = "0.3.1"
toml_edit = "0.25.19"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2"
toml = "1.2.1"
# Test-only: the scripted mail servers of the end-to-end tests.
base64 = "0.23.1"
rcgen = "0.14.10"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
time = "0.3.47"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
warnings = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(coverage_nightly)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
allow_attributes_without_reason = "deny"
module_name_repetitions = "allow"

[profile.release]
strip = true
