# Release on a version tag (`v0.1.0`): checks that the tag matches the crate
# version and is on main, runs the full CI for that commit, builds binaries for
# macOS and Linux, attaches them to a GitHub release and then publishes the
# crate to crates.io. See "Releasing" in the README.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  check:
    name: check tag and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: tag must match the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/mailctl/Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crate version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: the tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ci:
    name: CI
    needs: check
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.target }}
    needs: [check, ci]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          name="mailctl-${{ needs.check.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/mailctl" README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: mailctl-*.tar.gz*

  github-release:
    name: GitHub release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: create the release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" mailctl-*.tar.gz*
          --repo "$GITHUB_REPOSITORY" --title "mailctl ${{ needs.check.outputs.version }}"
          --generate-notes

  crates-io:
    name: publish to crates.io
    # After the GitHub release, so a failed build never reaches crates.io,
    # where a version cannot be replaced.
    needs: [check, github-release]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo publish -p mailctl --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
