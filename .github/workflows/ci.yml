# Self-contained CI: every check of this repository can be reproduced locally.
# Every merge into main is released: the version job derives the version from
# the commit messages, and the publish job ships it to crates.io and as a
# GitHub release with binaries. See "Releasing" in the README.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by the version job after it pushes a version commit: pushes made
  # with GITHUB_TOKEN never trigger workflows, so the required checks for the
  # new head commit are started explicitly.
  workflow_dispatch:

# Jobs get write access only where they need it.
permissions:
  contents: read

# A newer push to the same ref supersedes a running check. Runs on main
# publish releases, so every main run gets its own group (per commit): a shared
# group would let GitHub replace a pending main run, and that merge would never
# be released.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
    outputs:
      version: ${{ steps.effective.outputs.version }}
      version_tag: ${{ steps.effective.outputs.version_tag }}
    steps:
      # A fork's branch does not exist here and its token is read-only, so the
      # version could never be committed and main would fail after the merge.
      - name: Refuse pull requests from forks
        if: github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Pull requests from forks cannot get their version committed. A maintainer brings the change in through a branch of this repository (see Releasing in the README)."
          exit 1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-version walks the full history and tags to derive the version.
          fetch-depth: 0
          # On pull requests, check out the branch head instead of the merge
          # commit so the derived version can be committed back to the branch.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - name: Identify the pull request branch
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "branch=$HEAD_REF" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && \
               [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            pr="$(gh pr list --state open --head "$GITHUB_REF_NAME" --base "$DEFAULT_BRANCH" \
              --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')"
            if [ -n "$pr" ]; then
              echo "branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Calculate semantic version
        id: semantic
        uses: PaulHatch/semantic-version@5ae1354e589c5a67345fb2c6e65b025ff676d7c7 # v6.0.7
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"
      - name: Resolve effective version
        id: effective
        env:
          DERIVED: ${{ steps.semantic.outputs.version }}
        run: |
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/mailctl/Cargo.toml | head -n 1)"
          version="$DERIVED"
          if [ -n "$manifest" ] && [ "$manifest" != "$DERIVED" ] && \
             [ "$(printf '%s\n%s\n' "$DERIVED" "$manifest" | sort -V | tail -n 1)" = "$manifest" ]; then
            echo "Keeping manually raised Cargo.toml version $manifest (derived: $DERIVED)"
            version="$manifest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_tag=v$version" >> "$GITHUB_OUTPUT"
      # Outside pull requests there is no branch the job could push a fix to,
      # so a version mismatch must fail loudly instead of being papered over.
      - name: Verify Cargo.toml carries the effective version
        if: steps.pull-request.outputs.branch == ''
        env:
          VERSION: ${{ steps.effective.outputs.version }}
        run: |
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/mailctl/Cargo.toml | head -n 1)"
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::Cargo.toml version $manifest does not match the effective version $VERSION. The version job cannot commit a fix outside pull requests; raise the version on a pull request branch instead."
            exit 1
          fi
      - name: Commit derived version to the branch
        if: steps.pull-request.outputs.branch != ''
        env:
          VERSION: ${{ steps.effective.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.pull-request.outputs.branch }}
        run: |
          sed -i "0,/^version = \".*\"\$/s//version = \"$VERSION\"/" crates/mailctl/Cargo.toml
          sed -i "/^name = \"mailctl\"\$/{n;s/^version = \".*\"\$/version = \"$VERSION\"/;}" Cargo.lock
          if git diff --quiet; then
            echo "Cargo.toml already carries version $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Set crate version to $VERSION"
          git push origin "HEAD:refs/heads/$PR_BRANCH"
          gh workflow run ci.yml --ref "$PR_BRANCH"

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  coverage:
    name: coverage (100% gate)
    runs-on: ubuntu-latest
    env:
      # Nightly for `#[coverage(off)]`: cargo-llvm-cov then sets
      # `--cfg coverage_nightly`, which leaves out only the marked I/O wrappers.
      # Pinned to a date, so a new nightly cannot turn CI red on its own; bump
      # it on purpose. Builds, tests and lints use the stable toolchain.
      RUSTUP_TOOLCHAIN: nightly-2026-11-14
      COVERAGE_IGNORE: '(testing\.rs|src/tests/)'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-11-14
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Test code (`src/tests/`, `testing.rs`) is not production code; see
      # "Coverage" in the README.
      - run: cargo llvm-cov --workspace --all-features --locked --no-report
      - name: coverage gate
        run: >-
          cargo llvm-cov report
          --ignore-filename-regex "$COVERAGE_IGNORE"
          --fail-under-lines 100 --fail-under-regions 100 --fail-under-functions 100
      - name: list uncovered regions
        if: failure()
        run: |
          cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE" --json --output-path coverage.json
          python3 - <<'PY'
          import json
          data = json.load(open("coverage.json"))["data"][0]
          # A region counts as covered if any instantiation ran it.
          counts = {}
          for function in data["functions"]:
              for region in function["regions"]:
                  line, col, end_line, end_col, count, file_id, _, kind = region
                  if kind != 0:
                      continue
                  name = function["filenames"][file_id].split("/src/")[-1]
                  if name.startswith("tests/") or name == "testing.rs":
                      continue
                  key = (name, line, col, end_line, end_col)
                  counts[key] = max(counts.get(key, 0), count)
          for item in sorted(k for k, v in counts.items() if v == 0):
              print("%s:%d:%d-%d:%d" % item)
          PY

  dependencies:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  smoke:
    name: release build and smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          # The static Linux binary the release ships.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, features: vendored-openssl }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: matrix.target
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      - name: smoke test outside the source tree
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="$PWD/target/${TARGET:+$TARGET/}release/mailctl"
          if [ -n "$TARGET" ]; then
            file "$bin" | grep -Eq 'statically linked|static-pie linked'
          fi
          cd "$RUNNER_TEMP"
          "$bin" --version
          "$bin" ref '<a@example.com>' | grep -q '"mail_ref"'
          printf '[[accounts]]\nname = "ro"\nuser = "a@example.com"\naddress = "a@example.com"\nimap_host = "127.0.0.1"\nsmtp_host = "127.0.0.1"\nsent_folder = "Sent"\npassword = { env = "PW" }\n' > cfg.toml
          set +e
          PW=x "$bin" --config cfg.toml move -a ro --uid 1 --expect 0123456789 --to X > out.json
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'is set to `read`' out.json

  # Release path, main only: every merge is released.
  binaries:
    name: build ${{ matrix.target }}
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [version, lint, test, coverage, dependencies, smoke]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Static (musl, OpenSSL compiled in): runs on any x86_64 Linux,
          # including slim container images without libssl.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, features: vendored-openssl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Cross-built on the arm64 runner; checked below through Rosetta.
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      - name: the built binary runs
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/mailctl"
          "$bin" --version | grep -qx "mailctl ${{ needs.version.outputs.version }}"
          if [[ "${{ matrix.target }}" == *-musl ]]; then
            file "$bin" | grep -Eq 'statically linked|static-pie linked'
          fi
      - name: package
        shell: bash
        run: |
          name="mailctl-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/mailctl" README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: mailctl-*.tar.gz*
          if-no-files-found: error

  publish:
    name: publish release
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.binaries.result == 'success' }}
    needs: [version, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Releases are published one after another, never in parallel.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # On main the version job has already verified that Cargo.toml carries
      # the effective version, so the tree is clean and the package is
      # published exactly as committed; never with --allow-dirty.
      # Idempotent, so a re-run can finish a release whose later steps failed
      # after crates.io had already accepted the version.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if curl -fsS -A "mailctl-release (github.com/Nebensound/mailctl)" \
               "https://crates.io/api/v1/crates/mailctl/$VERSION" > /dev/null 2>&1; then
            echo "mailctl $VERSION is already on crates.io; continuing with the GitHub release"
          else
            cargo publish -p mailctl --locked
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # The tag is created here, on the exact commit that was built and
      # published, and only after crates.io accepted the version.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.version_tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" dist/mailctl-*.tar.gz* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "mailctl $TAG" --generate-notes
          fi
