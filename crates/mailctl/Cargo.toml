[package]
name = "mailctl"
version = "0.1.1"
description = "Safe, agent-friendly IMAP/SMTP command line tool for sorting mailboxes: per-account access levels, verified changes, no delete."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["imap", "email", "cli", "agent", "mailbox"]
categories = ["command-line-utilities", "email"]

[features]
## Compile OpenSSL into the binary, for hosts without the OpenSSL headers.
vendored-openssl = ["native-tls/vendored"]

[[bin]]
name = "mailctl"
path = "src/main.rs"

[dependencies]
async-imap.workspace = true
clap.workspace = true
futures-util.workspace = true
lettre.workspace = true
hickory-resolver.workspace = true
mail-parser.workspace = true
native-tls.workspace = true
roxmltree.workspace = true
rpassword.workspace = true
tokio.workspace = true
tokio-native-tls.workspace = true
toml_edit.workspace = true
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
base64.workspace = true
rcgen.workspace = true
rustls.workspace = true
time.workspace = true

[lints]
workspace = true
